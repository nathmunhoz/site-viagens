name: CI
run-name: Pipeline de integração continua e analise de código

on:
  pull_request:
    branches:
      - develop

jobs:
  test-and-analyze:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Install live-server
        run: npm install live-server --save-dev

      - name: Start server
        run: npx live-server --port=8080 &

      - name: Wait server
        run: sleep 5

      - name: Cypress permission
        run: chmod +x node_modules/.bin/cypress

      - name: Run Cypress
        run: npx cypress run

      - name: Sonar Scan
        uses: SonarSource/sonarqube-scan-action@v5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        with:
          args: >
            -Dsonar.projectKey=site-faculdade
            -Dsonar.projectName=site-faculdade
            -Dsonar.projectVersion=1.0
            -Dsonar.sources=.