name: continuos-deployment
run-name: Deploy do site

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 0

      - name: Docker login
        uses: docker/login-action@v3.4.0
        with:
          username: ${{ secrets.DOCKER_LOGIN }}
          password: ${{ secrets.DOCKER_PASSWORD }}
            
      - name: Docker build and push
        uses: docker/build-push-action@v6.16.0
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ secrets.DOCKER_LOGIN }}/site-viagens:latest

      - name: Azure Deploy
        uses: Azure/webapps-deploy@v3.0.3
        with:
          app-name: cd-viagens
          publish-profile: ${{ secrets.PUBLISH_PROFILE }}
          images: ${{ secrets.DOCKER_LOGIN }}/site-viagens:latest

  testes-e2e:
    needs: deploy 
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.2.2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Run Cypress E2E Tests
        uses: cypress-io/github-action@v6
        with:
          install: true
          wait-on: 'https://cd-viagens.azurewebsites.net'
          wait-on-timeout: 120
          config: baseUrl=https://cd-viagens.azurewebsites.net
        env:
          CYPRESS_BASE_URL: https://cd-viagens.azurewebsites.net